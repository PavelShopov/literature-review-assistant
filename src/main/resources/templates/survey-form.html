<!DOCTYPE html>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${survey != null} ? 'Edit Survey' : 'Create Survey'">Create Survey</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>

<body>

<div class="modal-overlay">

    <div class="survey-modal">

        <div class="modal-header">
            <h2 th:text="${survey != null} ? 'Edit Survey' : 'Create New Survey'">
                Create New Survey
            </h2>

            <a th:href="@{/survey}" class="close-btn">✕</a>
        </div>

        <form method="post"
              th:action="${survey != null} ? @{/survey/{id}/edit(id=${survey.id})} : @{/survey/new}">

            <div class="modal-body">

                <div class="form-group">
                    <label for="survey-title">Survey Name *</label>

                    <input type="text"
                           id="survey-title"
                           name="title"
                           th:value="${survey != null} ? ${survey.title} : ''"
                           placeholder="e.g., Impact of AI on Healthcare Outcomes"
                           required>
                </div>

                <div class="form-group">
                    <label for="survey-description">Description *</label>

                    <textarea id="survey-description"
                              name="description"
                              rows="4"
                              placeholder="Describe the purpose and scope of this systematic review..."
                              required
                              th:text="${survey != null} ? ${survey.description} : ''"></textarea>
                </div>

                <div class="form-group">
                    <label for="survey-status">Status *</label>

                    <select id="survey-status" name="status" class="status-select" required>
                        <option value="Draft"
                                th:selected="${survey == null || survey.status == 'Draft'}">
                            Draft
                        </option>

                        <option value="In Progress"
                                th:selected="${survey != null && survey.status == 'In Progress'}">
                            In Progress
                        </option>

                        <option value="Completed"
                                th:selected="${survey != null && survey.status == 'Completed'}">
                            Completed
                        </option>
                    </select>
                </div>

            </div>

            <div class="modal-footer">

                <a th:href="@{/survey}" class="cancel-btn">
                    Cancel
                </a>

                <button type="submit" class="save-btn"
                        th:text="${survey != null} ? 'Save Changes' : 'Create Survey'">
                    Create Survey
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
