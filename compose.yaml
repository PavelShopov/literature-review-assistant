services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: literature_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .  
    ports:
      - "1234:8080"
    volumes:
      - uploads_data:/app/uploads  # Docker manages this storage internally
      - storage_data:/app/storage
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/literature_db
      PAPER_IMPORT_STORAGE_DIR: /app/storage/pdfs

volumes:
  postgres_data:
  uploads_data:
  storage_data:
